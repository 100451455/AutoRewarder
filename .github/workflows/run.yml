name: AutoRewarder Diario Multicuenta con VPN

on:
  schedule:
    # Programado para ejecutarse a las 05:00 AM UTC (Equivale a primera hora de la mañana en España)
    - cron: '0 5 * * *'
  workflow_dispatch: # Botón para activarlo manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Conectar a tu VPN Doméstica (Tailscale)
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        args: --exit-node=100.81.154.99 --accept-routes

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: '**/requirements.txt'
        python-version: '3.10'

    - name: Instalar dependencias del Bot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear estructura de carpetas de AutoRewarder e inyectar cuentas
      env:
        CUENTAS_SECRET: ${{ secrets.CUENTAS_JSON }}
      run: |
        # Creamos la ruta oficial de datos del bot en Linux según su documentación
        mkdir -p ~/.local/share/AutoRewarder
        
        # Guardamos el archivo de configuración indexado en su sitio correcto
        echo "$CUENTAS_SECRET" > ~/.local/share/AutoRewarder/accounts.json

    - name: Ejecutar AutoRewarder en cadena
      run: |
        # Ejecutamos las cuentas llamándolas por su 'label' o 'id' tal y como requiere el CLI del bot
        echo "Lanzando automatización para Cuenta Principal..."
        python AutoRewarder_CLI.py --account "Principal" --pc 20 --mobile 0
        
        # Si tienes una segunda cuenta en el JSON, descomenta las dos líneas de abajo eliminando el '#'
        # echo "Lanzando automatización para Cuenta Secundaria..."
        # python AutoRewarder_CLI.py --account "Secundaria" --pc 20 --mobile 0
