name: AutoRewarder Diario Multicuenta con VPN

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 AM UTC (Aprox. 06:00 AM o 07:00 AM en España)
    - cron: '0 5 * * *'
  workflow_dispatch: # Botón para activarlo manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Conectar a tu VPN Doméstica (Tailscale)
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        args: --exit-node=100.81.154.99 --accept-routes

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: '**/requirements.txt'
        python-version: '3.10'

    - name: Instalar dependencias del Bot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Crear archivo de cuentas seguro
      env:
        CUENTAS_SECRET: ${{ secrets.CUENTAS_JSON }}
      run: |
        echo "$CUENTAS_SECRET" > accounts.json

    - name: Ejecutar AutoRewarder
      run: |
        # Ejecuta el bot de forma nativa para que procese tus cuentas de accounts.json
        # Configuramos --pc 30 y --mobile 20 para cubrir los límites diarios típicos (puedes ajustar los números)
        python AutoRewarder_CLI.py --pc 20 --mobile 0
